<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMD 식수체크</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --navy:#1f3a5f; --bg:#f2f4f7; --card:#ffffff; --text:#1d2633; --muted:#6b7684; --line:#dfe3e8;
    --ok:#15803d; --bad:#c62828; --warn:#c2620a; --wait:#3b5b85;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  header h1{font-size:20px;margin:0;font-weight:700}
  .meta{display:flex;align-items:center;gap:10px;font-size:18px}
  #clock{font-variant-numeric:tabular-nums}
  .badge{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:700;white-space:nowrap}
  .badge.off{background:#8b2b2b}
  .iconbtn{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
  @media (max-width:820px),(orientation:portrait){main{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  #reader{width:100%;min-height:260px;border-radius:12px;overflow:hidden;background:#111}
  #reader video{border-radius:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
  .btn.ghost{background:#e8ecf2;color:var(--text)}
  .btn.white{background:#fff;color:var(--bad)}
  .hint{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.5}
  #result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
          min-height:340px;border-radius:16px;padding:24px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .15s}
  #result .big{font-size:clamp(40px,8vw,72px);font-weight:800;line-height:1.1}
  #result .team{font-size:clamp(22px,4vw,34px);font-weight:700;margin-top:14px}
  #result .sub{font-size:clamp(18px,3vw,26px);margin-top:8px;opacity:.95}
  #result.ok,#result.bad,#result.warn,#result.wait{color:#fff}
  #result.ok{background:var(--ok)} #result.bad{background:var(--bad)}
  #result.warn{background:var(--warn)} #result.wait{background:var(--wait)}
  #adminBox{margin-top:18px;display:none}
  dialog{border:0;border-radius:16px;padding:20px;width:min(520px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
  dialog h2{margin:0 0 12px;font-size:20px}
  dialog label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
  dialog input,dialog select{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px}
  #setMsg{font-size:14px;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<header>
  <h1>DMD 식수체크</h1>
  <div class="meta">
    <span id="clock">--:--:--</span>
    <span id="mealBadge" class="badge off">연결 전</span>
    <button class="iconbtn" id="setBtn" title="설정">⚙</button>
  </div>
</header>

<main>
  <section class="card">
    <div id="reader"></div>
    <div class="row">
      <button class="btn" id="camBtn">▶ 카메라 시작</button>
      <button class="btn ghost" id="manualBtn">코드 직접 입력</button>
    </div>
    <p class="hint">팀 QR코드를 카메라에 비춰주세요. USB·블루투스 QR 스캐너를 연결하면 카메라 없이도 바로 인식됩니다.</p>
  </section>

  <section id="result">
    <div class="big" id="rBig">QR을 비춰주세요</div>
    <div class="team" id="rTeam"></div>
    <div class="sub" id="rSub"></div>
    <div id="adminBox"><button class="btn white" id="adminBtn">관리자 PIN으로 허용</button></div>
  </section>
</main>

<dialog id="setDlg">
  <h2>스캐너 설정</h2>
  <label for="fApi">웹앱 URL (Apps Script 배포 주소, …/exec 로 끝남)</label>
  <input id="fApi" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="fKey">기기키 ([설정] 시트의 기기키)</label>
  <input id="fKey" autocomplete="off">
  <label for="fFacing">카메라</label>
  <select id="fFacing">
    <option value="user">전면 카메라 (태블릿 화면이 이용자 쪽을 볼 때)</option>
    <option value="environment">후면 카메라</option>
  </select>
  <div id="setMsg"></div>
  <div class="row">
    <button class="btn" id="saveBtn">저장 및 연결 확인</button>
    <button class="btn ghost" id="closeBtn">닫기</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const LS = 'dmdMealScanner';
let cfg = loadCfg();
let schedule = null, scanner = null, busy = false, lastCode = '', lastAt = 0;
let holdTimer = null, audioCtx = null, wakeLock = null;

function loadCfg(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function saveCfg(){ try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch(e){} }

async function api(params){
  if (!cfg.api) throw new Error('설정 필요');
  const qs = new URLSearchParams(Object.assign({}, params, { key: cfg.key || '', t: Date.now() }));
  const r = await fetch(cfg.api + '?' + qs.toString());
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* 시계 & 현재 식사 */
function pad(n){ return String(n).padStart(2,'0'); }
function tick(){
  const d = new Date();
  $('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const b = $('mealBadge');
  if (!schedule){ return; }
  const hm = pad(d.getHours())+':'+pad(d.getMinutes());
  let cur = null;
  for (const m of ['아침','점심','저녁']){
    const s = schedule[m];
    if (s && s.start && s.end && hm >= s.start && hm < s.end){ cur = m; break; }
  }
  b.textContent = cur ? cur + ' 시간 (~' + schedule[cur].end + ')' : '식사 시간 아님';
  b.className = 'badge' + (cur ? '' : ' off');
}
async function ping(){
  try {
    const r = await api({ action:'ping' });
    if (r.ok){ schedule = r.schedule; tick(); return r; }
    $('mealBadge').textContent = r.status; $('mealBadge').className = 'badge off';
    return r;
  } catch(e){
    $('mealBadge').textContent = '연결 오류'; $('mealBadge').className = 'badge off';
    return { ok:false, message: e.message };
  }
}

/* 결과 화면 */
function show(cls, big, team, sub, showAdmin){
  clearTimeout(holdTimer);
  $('result').className = cls || '';
  $('rBig').textContent = big; $('rTeam').textContent = team || ''; $('rSub').textContent = sub || '';
  $('adminBox').style.display = showAdmin ? 'block' : 'none';
}
function idle(){ show('', 'QR을 비춰주세요', '', ''); }
function hold(ms){ clearTimeout(holdTimer); holdTimer = setTimeout(idle, ms); }

function render(r){
  const map = { '승인':'ok', '관리자허용':'ok', '초과':'bad', '식수없음':'bad', '미등록':'bad', '시간외':'warn', 'PIN오류':'warn', '인증실패':'warn', '오류':'warn' };
  const title = { '승인':'✓ 확인되었습니다', '관리자허용':'✓ 관리자 허용', '초과':'✕ 식수 초과', '식수없음':'✕ 식수 없음', '미등록':'✕ 미등록 QR', '시간외':'식사 시간이 아닙니다', 'PIN오류':'PIN이 틀렸습니다', '인증실패':'기기 인증 실패' };
  const cls = map[r.status] || 'warn';
  const team = r.team ? r.team + (r.meal ? ' · ' + r.meal : '') : '';
  let sub = r.message || '';
  if (r.status === '승인' || r.status === '관리자허용') sub = r.used + ' / ' + r.quota + '명  (남은 식수 ' + r.remaining + ')';
  else if (r.status === '초과') sub = r.used + ' / ' + r.quota + '명 — ' + (r.message || '');
  const canAdmin = (r.status === '초과' || r.status === 'PIN오류') && r.pinEnabled;
  show(cls, title[r.status] || r.status, team, sub, canAdmin);
  beep(r.ok);
  hold(r.ok ? 2200 : (canAdmin ? 10000 : 3500));
}

async function handleCode(raw, pin){
  const code = String(raw || '').trim().toUpperCase();
  if (!code || busy) return;
  const now = Date.now();
  if (!pin && code === lastCode && now - lastAt < 3000) return; // 같은 화면 반복 인식 방지
  lastCode = code; lastAt = now; busy = true;
  show('wait', '확인 중…', '', '');
  try {
    const p = { action:'scan', code }; if (pin) p.pin = pin;
    render(await api(p));
  } catch(e){
    show('warn', '연결 오류', '', '인터넷 연결 또는 ⚙ 설정을 확인하세요');
    beep(false); hold(3500);
  } finally {
    busy = false; lastAt = Date.now();
  }
}

/* 카메라 */
async function startCamera(){
  unlockAudio(); keepAwake();
  if (scanner){ try { await scanner.stop(); } catch(e){} }
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start(
      { facingMode: cfg.facing || 'user' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width:s, height:s }; } },
      txt => handleCode(txt),
      () => {}
    );
    $('camBtn').textContent = '↻ 카메라 다시 시작';
  } catch(e){
    show('warn', '카메라를 열 수 없습니다', '', '브라우저의 카메라 권한을 허용하거나 USB 스캐너를 사용하세요');
  }
}

/* USB·블루투스 스캐너 (키보드처럼 입력 후 Enter) */
let kbuf = '', ktime = 0;
document.addEventListener('keydown', e => {
  if ($('setDlg').open) return;
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const t = Date.now();
  if (t - ktime > 150) kbuf = '';
  ktime = t;
  if (e.key === 'Enter'){ if (kbuf.length >= 4) handleCode(kbuf); kbuf = ''; e.preventDefault(); return; }
  if (e.key.length === 1) kbuf += e.key;
});

/* 소리 */
function unlockAudio(){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){}
}
function tone(f, d, at){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.25;
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + at; o.start(t); o.stop(t + d);
}
function beep(ok){
  if (!audioCtx) return;
  try { if (ok) tone(1250, .15, 0); else { tone(320, .18, 0); tone(320, .18, .26); } } catch(e){}
}

/* 화면 꺼짐 방지 */
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

/* 설정 */
function openSettings(){
  $('fApi').value = cfg.api || ''; $('fKey').value = cfg.key || ''; $('fFacing').value = cfg.facing || 'user';
  $('setMsg').textContent = '';
  $('setDlg').showModal();
}
$('setBtn').onclick = openSettings;
$('closeBtn').onclick = () => $('setDlg').close();
$('saveBtn').onclick = async () => {
  const facingChanged = (cfg.facing || 'user') !== $('fFacing').value;
  cfg.api = $('fApi').value.trim(); cfg.key = $('fKey').value.trim(); cfg.facing = $('fFacing').value;
  saveCfg();
  $('setMsg').textContent = '연결 확인 중…';
  const r = await ping();
  if (r.ok){
    $('setMsg').textContent = '✓ 연결되었습니다';
    setTimeout(() => $('setDlg').close(), 700);
    if (facingChanged && scanner) startCamera();
  } else {
    $('setMsg').textContent = '✕ ' + (r.message || r.status || '연결 실패');
  }
};

$('camBtn').onclick = startCamera;
$('manualBtn').onclick = () => {
  unlockAudio();
  const c = prompt('팀코드를 입력하세요 (예: T7K3QX9)');
  if (c) { lastCode = ''; handleCode(c); }
};
$('adminBtn').onclick = () => {
  const pin = prompt('관리자 PIN을 입력하세요');
  if (pin) handleCode(lastCode, pin.trim());
};

setInterval(tick, 1000);
setInterval(ping, 5 * 60 * 1000);
tick();
if (cfg.api) ping(); else openSettings();
</script>
</body>
</html>
